<!DOCTYPE html>
<html lang="en">
<head>
  <!-- 
    Meta information and title.
    HTML basics: https://www.w3schools.com/html/default.asp
    Bootstrap grid: https://getbootstrap.com/docs/5.3/layout/grid/
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cyberland - Where the fun never stops! Explore Apprenticeships, Vacancies, and Training Courses.">
  <meta name="keywords" content="Theme park, Cyberland, Family Day out, Apprenticeships, Entertainment Careers, Training">
  <meta name="author" content="Cyberland IT Team">
  <title>Cyberland - Where the fun never stops!</title>
  <!-- Bootstrap CSS for grid system and responsive design -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS for site-specific styling; see https://www.w3schools.com/css/default.asp -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Section: contains the navigation and main title -->
  <header>
    <!-- 
      Hamburger Menu Toggle Button 
      Visible on mobile devices only.
      JavaScript DOM manipulation reference: https://www.w3schools.com/js/default.asp
    -->
    <button class="menu-toggle">☰</button>
    <!-- Main Title: Centered in header; color set in CSS -->
    <h1>Cyberland Theme Park</h1>
    <!-- Logo positioned on the top-right -->
    <img src="logo.png" alt="Cyberland Logo" class="img-fluid logo">
    <!-- Navigation Menu: Uses an unordered list.
         For more on HTML lists and navigation: https://www.w3schools.com/html/html_lists.asp
    -->
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="apprenticeships.html">Apprenticeships</a></li>
        <li><a href="vacancies.html">Vacancies</a></li>
        <li><a href="apply.html">Apply Now</a></li>
		<li><a href="training.html">Training Courses</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content Section: utilizes Bootstrap grid for responsive layout -->
  <main class="container my-5">
    <div class="row">
      <!-- Left column: Text content -->
      <div class="col-md-6">
        <section class="p-4">
          <h2>Welcome to Cyberland!</h2>
          <p>
            Experience the thrill of entertainment with our exciting theme park.
            Explore career and training opportunities with us!
          </p>
        </section>
      </div>
      <!-- Right column: Images arranged in a responsive grid -->
      <div class="col-md-6">
        <div class="row">
          <!-- Each image is wrapped in a Bootstrap column for responsiveness -->
          <div class="col-6 mb-3">
            <img src="https://media.istockphoto.com/id/139717376/photo/peril-upside-down-on-a-rollercoaster.jpg?s=612x612&w=0&k=20&c=oRmP8yNA2P5I25f6_6CNlwlse90QSbiRakCB2odajpI=" 
                 class="img-fluid" alt="Roller coaster looping upside down">
          </div>
          <div class="col-6 mb-3">
            <img src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/2e/8d/32/ba/water-park.jpg?w=900&h=500&s=1" 
                 class="img-fluid" alt="People enjoying a water park">
          </div>
          <div class="col-6 mb-3">
            <img src="https://thdaily.s3.us-west-1.amazonaws.com/final_size-Themepark_20240616233719.png" 
                 class="img-fluid" alt="Colorful theme park area">
          </div>
          <div class="col-6 mb-3">
            <img src="https://media1.thrillophilia.com/filestore/wbs8w3f5suvdfcvx7hbg1kcrgnsj_1622546003_shutterstock_649854703.png?w=400&dpr=2" 
                 class="img-fluid" alt="Ferris wheel at an amusement park">
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Section -->
  <footer>
    <p>&copy; 2025 Cyberland. All Rights Reserved.</p>
  </footer>

  <!-- Bootstrap JS for interactive components -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JavaScript; see https://www.w3schools.com/js/default.asp -->
  <script src="script.js"></script>
</body>
</html>

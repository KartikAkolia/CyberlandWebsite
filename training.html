<html lang="en">

  <title>Apply Now - Cyberland</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header style="position: relative; background-color: #ff9800; padding: 15px; text-align: center;">
    <!-- Menu Toggle -->
    <button class="menu-toggle" style="position: absolute; top: 15px; left: 20px;">☰</button>
    <!-- Main Title -->
    <h1 style="margin: 0;">Cyberland Theme Park</h1>
    <!-- Logo in Top-Right -->
    <img src="logo.png" alt="Cyberland Logo" class="img-fluid"
         style="position: absolute; top: 5px; right: 20px; max-width: 150px; height: auto;">
    <!-- Navigation -->
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="apprenticeships.html">Apprenticeships</a></li>
        <li><a href="vacancies.html">Vacancies</a></li>
        <li><a href="training.html">Training Courses</a></li>
      </ul>
    </nav>
  </header>
  
  <main class="container my-3 training-page">
    <h2>Apply Now</h2>
    <form action="submit_application.php" method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="vacancy" class="form-label">Vacancy</label>
        <select id="vacancy" name="vacancy" class="form-select" required>
          <option value="">Select a vacancy</option>
          <option value="entertainments_supervisor">Entertainments Technical Supervisor</option>
          <option value="lego_production_supervisor">LEGO Production Planning Supervisor</option>
          <option value="it_support_analyst">IT Support Analyst</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control">
      </div>
      <div class="mb-3">
        <label for="cv" class="form-label">Upload CV</label>
        <input type="file" id="cv" name="cv" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="cover-letter" class="form-label">Upload Cover Letter</label>
        <input type="file" id="cover-letter" name="cover_letter" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Submit Application</button>
    </form>
  </main>
  
  <footer>

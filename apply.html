  <!-- Custom CSS: https://www.w3schools.com/css/default.asp -->

</head>
<body>
  <!-- Header Section -->
  <header>
    <!-- 
      Hamburger Menu Toggle for mobile devices.
      Refer to: https://www.w3schools.com/js/default.asp for DOM manipulation.
    -->
    <button class="menu-toggle">☰</button>
    <!-- Main Title -->
    <h1>Cyberland Theme Park</h1>
    <!-- Logo positioned on the top-right -->
    <img src="logo.png" alt="Cyberland Logo" class="img-fluid logo">
    <!-- Navigation Menu using an unordered list -->
    <nav>
      <ul class="nav-links">
        <!-- Links for navigation; see HTML lists: https://www.w3schools.com/html/html_lists.asp -->
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="apprenticeships.html">Apprenticeships</a></li>
        <li><a href="vacancies.html">Vacancies</a></li>
        <li><a href="apply.html">Apply Now</a></li>
		<li><a href="training.html">Training Courses</a></li>
      </ul>
    </nav>
  </header>
  
  <!-- Main Content Section: Form for application -->
  <main class="container my-3 training-page">
    <!-- Heading for the application form -->
    <h2>Apply Now</h2>
    <!-- 
      Application Form: Uses Bootstrap classes for spacing and form styling.
      For form controls, see: https://www.w3schools.com/html/html_forms.asp
    -->
    <form action="submit_application.php" method="POST" enctype="multipart/form-data">
      <!-- Vacancy Selection -->
      <div class="mb-3">
        <label for="vacancy" class="form-label">Vacancy</label>
        <select id="vacancy" name="vacancy" class="form-select" required>
          <option value="">Select a vacancy</option>
          <option value="entertainments_supervisor">Entertainments Technical Supervisor</option>
          <option value="lego_production_supervisor">LEGO Production Planning Supervisor</option>
          <option value="it_support_analyst">IT Support Analyst</option>
        </select>
      </div>
      <!-- Full Name Input -->
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" required>
      </div>
      <!-- Email Input -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" required>
      </div>
      <!-- Phone Number Input -->
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control">
      </div>
      <!-- CV Upload -->
      <div class="mb-3">
        <label for="cv" class="form-label">Upload CV</label>
        <input type="file" id="cv" name="cv" class="form-control" required>
      </div>
      <!-- Cover Letter Upload -->
      <div class="mb-3">
        <label for="cover-letter" class="form-label">Upload Cover Letter</label>
        <input type="file" id="cover-letter" name="cover_letter" class="form-control" required>
      </div>
      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Submit Application</button>
    </form>
  </main>
  
  <!-- Footer Section -->
  <footer>
    <p>&copy; 2025 Cyberland. All Rights Reserved.</p>
  </footer>

</body>
